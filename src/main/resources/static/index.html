<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>주문하기</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f7f9fc;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: rgba(255, 107, 107, 0.61);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: rgba(255, 107, 107, 0.61);
        }
    </style>
</head>
<body onclick="location.href='/mockup/order'">
    <button > 화면 클릭 시 주문창으로 이동합니다.</button>
</body>
</html>
