<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>스탬프북</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .count-info {
            margin-top: 10px;
            font-size: 18px;
            color: #333;
        }

        .stamp-container {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .stamp {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .stamp.filled {
            background-color: #ff6b6b;
            color: white;
        }

        .phone-display {
            font-size: 24px;
            letter-spacing: 2px;
            margin: 20px 0;
            border-bottom: 2px solid #ccc;
            padding: 10px;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        .dial-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .dial-btn {
            background-color: #fff;
            border: 1px solid #999;
            border-radius: 10px;
            font-size: 20px;
            padding: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .dial-btn:hover {
            background-color: #eee;
        }

        .actions {
            margin-top: 15px;
        }

        .submit-btn, .clear-btn {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>쿠폰북 스탬프</h1>
<div class="count-info" th:text="${stampCount} + ' / ' + ${totalStamp} + ' 개 스탬프 적립됨' + '(사용 가능한 쿠폰 수 : ' + ${useableCoupon} + ')'"></div>

<div class="stamp-container">
    <div th:each="i : ${#numbers.sequence(1, totalStamp)}"
         th:classappend="${i <= stampCount} ? 'stamp filled' : 'stamp'"
         th:text="${i}"></div>
</div>

<div class="actions">
    <button id="coupon-btn" class="submit-btn" type="button" th:onclick="'usedCoupon(' + ${useableCoupon} + ')'">쿠폰사용</button>
    <button class="submit-btn" type="button" onclick="payment()">결제하기</button>
</div>


<script th:inline="javascript">
    const phone = /*[[${phone}]]*/ "";

    function usedCoupon(useableCoupon) {
        alert('현재 사용 가능한 쿠폰 수 : ' + useableCoupon);

        if (useableCoupon < 1) {
            alert("사용 가능한 쿠폰이 없습니다.");
            //window.location.href = `/main`;
            return;
        }

        fetch('/showStamp', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                phone: phone,
                usedCouponCnt: 1,
                couponCnt: useableCoupon - 1
            })
        })
        .then(response => {
            if (!response.ok) throw new Error('서버 오류');
            return response.text();
        })
        .then(data => {
            alert('쿠폰 사용 완료!');
            // 조회 페이지로 이동
            //window.location.href = `/main`;

            //현재화면 유지
            //window.location.reload();
        })
        .catch(error => {
            alert('실패: ' + error.message);
        });
    }

    function payment() {
        // 결제 페이지로 이동
        // window.location.href = `/showStamp?phone=${phone}`;
    }
</script>

</body>
</html>
