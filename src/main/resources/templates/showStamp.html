<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>스탬프북</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .count-info {
            margin-top: 10px;
            font-size: 18px;
            color: #333;
        }

        .stamp-container {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .stamp {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .stamp.filled {
            background-color: #ff6b6b;
            color: white;
        }

        .phone-display {
            font-size: 24px;
            letter-spacing: 2px;
            margin: 20px 0;
            border-bottom: 2px solid #ccc;
            padding: 10px;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        .dial-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .dial-btn {
            background-color: #fff;
            border: 1px solid #999;
            border-radius: 10px;
            font-size: 20px;
            padding: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .dial-btn:hover {
            background-color: #eee;
        }

        .actions {
            margin-top: 15px;
        }

        .submit-btn, .clear-btn {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>쿠폰북 스탬프</h1>
<div class="count-info" th:text="${stampCount} + ' / ' + ${totalStamp} + ' 개 스탬프 적립됨' + '(사용 가능한 쿠폰 수 : ' + ${useableCoupon} + ')'"></div>
<input type="hidden" name = "iceQty" id="inputIceQty" value="1" th:value="${iceQty}" />
<input type="hidden" name= "hotQty" id="inputHotQty" value="1" th:value="${hotQty}" />
<input type="hidden" name= "totalPrice" id="inputTotalPrice" value="3000" th:value="${totalPrice}" />
<div class="order-info" th:text="'결제 금액 : ' + ${totalPrice} + '(아이스 아메리카노 : ' + ${iceQty} + ', 핫 아메리카노 : ' + ${hotQty} + ')'">쿠폰수량</div>

<div class="stamp-container">
    <div th:each="i : ${#numbers.sequence(1, totalStamp)}"
         th:classappend="${i <= stampCount} ? 'stamp filled' : 'stamp'"
         th:text="${i}"></div>
</div>

<div class="actions">
    <button id="coupon-btn" class="submit-btn" type="button" th:onclick="'usedCoupon(' + ${useableCoupon} + ')'">쿠폰사용</button>
    <button class="submit-btn" type="button" onclick="payment()">결제하기</button>
</div>


<script th:inline="javascript">
    const phone = /*[[${phone}]]*/ "";

   async function usedCoupon(useableCoupon) {
    if (useableCoupon < 1) {
        alert("사용 가능한 쿠폰이 없습니다.");
        window.location.reload();
        return;
    }

    let couponCount = await promptCouponSelection(useableCoupon);
    if (couponCount === null) return; // 취소 시 종료

    fetch('/showStamp', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            phone: phone,
            usedCouponCnt: couponCount,
            couponCnt: useableCoupon - couponCount
        })
    })
    .then(response => {
        if (!response.ok) throw new Error('서버 오류');
        return response.text();
    })
    .then(data => {
        alert(couponCount + '개 쿠폰 사용 완료!');
        window.location.reload();
    })
    .catch(error => {
        alert('실패: ' + error.message);
    });
    }

    // 쿠폰 갯수 선택용 다이얼로그
    function promptCouponSelection(maxCount) {
        // 간단하게 select 박스로 UI 구성
        let wrapper = document.createElement("div");
        wrapper.style.position = "fixed";
        wrapper.style.top = "0";
        wrapper.style.left = "0";
        wrapper.style.width = "100%";
        wrapper.style.height = "100%";
        wrapper.style.background = "rgba(0,0,0,0.5)";
        wrapper.style.display = "flex";
        wrapper.style.justifyContent = "center";
        wrapper.style.alignItems = "center";
        wrapper.style.zIndex = "9999";

        let box = document.createElement("div");
        box.style.background = "#fff";
        box.style.padding = "20px";
        box.style.borderRadius = "8px";
        box.style.textAlign = "center";

        let label = document.createElement("p");
        label.innerText = "사용할 쿠폰 개수를 선택하세요 (최대 " + maxCount + "개)";
        box.appendChild(label);

        let select = document.createElement("select");
        for (let i = 1; i <= maxCount; i++) {
            let option = document.createElement("option");
            option.value = i;
            option.text = i + "개";
            select.appendChild(option);
        }
        box.appendChild(select);

        let btnConfirm = document.createElement("button");
        btnConfirm.innerText = "확인";
        btnConfirm.style.margin = "10px";
        let btnCancel = document.createElement("button");
        btnCancel.innerText = "취소";

        box.appendChild(btnConfirm);
        box.appendChild(btnCancel);
        wrapper.appendChild(box);
        document.body.appendChild(wrapper);

        return new Promise((resolve) => {
            btnConfirm.onclick = () => {
                let value = parseInt(select.value);
                document.body.removeChild(wrapper);
                resolve(value);
            };
            btnCancel.onclick = () => {
                document.body.removeChild(wrapper);
                resolve(null);
            };
        });
    }

    function payment() {
        // 결제 페이지로 이동
        //window.location.href = `/payment?phone=${phone}`;


        //새로운 창 열기
        // phone 값을 포함한 결제 URL 구성
        const url = `/payment?phone=${phone}`;

        // 팝업 창 옵션
        const windowFeatures = 'width=600,height=800,top=100,left=100,resizable=yes,scrollbars=yes';

        // 새 창 열기
        window.open(url, 'paymentWindow', windowFeatures);
    }
</script>

</body>
</html>
