<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>스탬프북</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .count-info order-info {
            margin-top: 10px;
            font-size: 18px;
            color: #333;
        }

        .stamp-container {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .stamp {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .stamp.filled {
            background-color: #ff6b6b;
            color: white;
        }

        .phone-display {
            font-size: 24px;
            letter-spacing: 2px;
            margin: 20px 0;
            border-bottom: 2px solid #ccc;
            padding: 10px;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        .dial-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .actions {
            margin-top: 15px;
        }

        .submit-btn, .clear-btn {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>쿠폰북 스탬프</h1>
<div class="count-info" th:text="'현재 적립 스탬프 : ' + ${stampCount} + ' / ' + ${totalStamp}  + ' (사용 가능한 쿠폰 수 : ' + ${useableCoupon} + ')'"></div>
<div class="order-info" th:text="'결제 시 ' +(${iceQty} + ${hotQty}) + ' 개 스탬프 적립될 예정입니다. '"></div>

<div class="stamp-container">
    <div th:each="i : ${#numbers.sequence(1, totalStamp)}"
         th:classappend="${i <= stampCount} ? 'stamp filled' : 'stamp'"
         th:text="${i}"></div>
</div>

<div class="actions">
    <form id="couponForm" method="post" action="/useCoupon">
        <input type="hidden" name="orderIceQty" th:value="${iceQty}" />
        <input type="hidden" name="orderHotQty" th:value="${hotQty}" />
        <input type="hidden" name="orderTotalPrice" th:value="${totalPrice}" />

        <input type="hidden" name="phone" th:value="${phone}" />
        <input type="hidden" name="usedCouponCnt" value="1" />
        <input type="hidden" name="couponCnt" th:value="${useableCoupon - 1}" />
        <button id="coupon-btn" class="submit-btn" type="button" onclick="handleUseCoupon()">쿠폰사용</button>
    </form>
    <form id="directPayment" method="post" action="/directPayment">
        <input type="hidden" name="orderIceQty" th:value="${iceQty}" />
        <input type="hidden" name="orderHotQty" th:value="${hotQty}" />
        <input type="hidden" name="orderTotalPrice" th:value="${totalPrice}" />
        <input type="hidden" name="phone" th:value="${phone}" />
        <button class="submit-btn" type="submit" >결제하기</button>
    </form>
</div>


<script th:inline="javascript">
    const phone = /*[[${phone}]]*/ "";
    const useableCoupon = /*[[${useableCoupon}]]*/ 0;

    function handleUseCoupon() {
        if (useableCoupon == 0) {
            alert("사용 가능한 쿠폰이 없습니다.");
            return;
        }
        document.getElementById('couponForm').submit();
    }

    function payment() {
        // 결제 페이지로 이동
        window.location.href = `/useCouponPayment?phone=${phone}`;
    }
</script>

</body>
</html>
