<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 키오스크</title>
    <style>
        body {
            font-family: 'Arial';
            padding: 30px;
            background: #f4f4f4;
            text-align: center;
        }
        .menu-list{
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2열 */
            gap: 30px;
            max-width: 700px;
            margin: 0 auto 50px;
        }
        .menu-item {
            background: #fff;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
        }
        .menu-item h3 {
            margin: 0;
        }
        .quantity-control {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .quantity-control button {
            width: 30px;
            height: 30px;
            font-size: 18px;
        }
        .total {
            font-size: 24px;
            margin-top: 30px;
        }
        .submit-btn {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #orderSummary {
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 20px; /* 주문 내역과 총 합계 사이 간격 */
            line-height: 1.6;
        }

        .total h2:last-child {
            margin-top: 30px; /* 총 합계 위쪽 띄우기 */
        }
    </style>
</head>
<body>

<h1>주문하기</h1>
<div class="menu-list">
    <div class="menu-item">
        <h3>아이스 아메리카노</h3>
        <p>₩1500</p>
        <div class="size-control">
            <label for="iceSize">사이즈:</label>
            <select id="iceSize">
                <option value="tall">Tall</option>
                <option value="grande">Grande</option>
                <option value="venti">Venti</option>
            </select>
        </div>
        <div class="quantity-control">
            <button type="button" onclick="updateQuantity('ice', -1)">-</button>
            <span id="iceQty">0</span>
            <button type="button" onclick="updateQuantity('ice', 1)">+</button>
        </div>
    </div>

    <div class="menu-item">
        <h3>핫 아메리카노</h3>
        <p>₩1000</p>
        <div class="size-control">
            <label>
                <input type="radio" name="hotSize" value="tall" checked>
                Tall
            </label>
            <label>
                <input type="radio" name="hotSize" value="grande">
                Grande
            </label>
            <label>
                <input type="radio" name="hotSize" value="venti">
                Venti
            </label>
        </div>
        <div class="quantity-control">
            <button type="button" onclick="updateQuantity('hot', -1)">-</button>
            <span id="hotQty">0</span>
            <button type="button" onclick="updateQuantity('hot', 1)">+</button>
        </div>
    </div>
</div>

<div class="total">
    주문 내역
    <div id="orderSummary"></div> <!-- 주문 내역이 표시될 영역 -->

    주문 갯수 : <span id="totalCnt">0</span>개 , 총 합계: ₩<span id="totalPrice">0</span>

</div>

<form id="orderForm" method="post" th:action="@{/order}">
    <input type="hidden" name="iceQty" id="inputIceQty" value="0"/>
    <input type="hidden" name="hotQty" id="inputHotQty" value="0"/>
    <input type="hidden" name="totalCnt" id="inputTotalCnt" value="0"/>
    <input type="hidden" name="totalPrice" id="inputTotalPrice" value="0"/>
    <button type="button" class="submit-btn" onclick="submitOrder()">결제하기</button>
    <button type="button" class="submit-btn" onclick="useCoupon()">쿠폰사용</button>
    <button type="button" class="submit-btn" onclick="pageBack()">뒤로가기</button>
</form>

<!-- 적립 여부 모달창 -->
<div id="popupModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
    <div style="background:#fff; padding:20px; border-radius:10px; text-align:center; width:250px;">
        <p id="popupMessage">적립하시겠습니까?<br><small id="countdown"></small></p>
        <button onclick="confirmYes()">예</button>
        <button onclick="confirmNo()">아니오</button>
    </div>
</div>

<script>
    let iceQty = 0;
    let hotQty = 0;
    let totalCnt = 0;

    function updateQuantity(type, change) {
        if (type === 'ice') {
            iceQty = Math.max(0, iceQty + change);
            document.getElementById('iceQty').innerText = iceQty;
        } else if (type === 'hot') {
            hotQty = Math.max(0, hotQty + change);
            document.getElementById('hotQty').innerText = hotQty;
        }

        const iceSize = document.getElementById('iceSize').value;
        const hotSize = document.querySelector('input[name="hotSize"]:checked').value;

        updateTotal(iceSize, hotSize);
    }

    function updateTotal(iceSize, hotSize) {

        const icePrice = updatePrice(iceSize, 1500);
        const hotPrice = updatePrice(hotSize, 1000);

        const total = (iceQty * icePrice) + (hotQty * hotPrice);
        const totalCnt = iceQty + hotQty;

        document.getElementById('totalCnt').innerText = totalCnt;
        document.getElementById('totalPrice').innerText = total;

        document.getElementById('inputTotalCnt').value = totalCnt;
        document.getElementById('inputTotalPrice').value = total;

        document.getElementById('inputIceQty').value = iceQty;
        document.getElementById('inputHotQty').value = hotQty;

         // 주문 내역 표시
        let summary = "";
        if (iceQty > 0) {
            summary += `아이스 아메리카노 (${iceSize}) x ${iceQty} → ₩${iceQty * icePrice}<br>`;
        }
        if (hotQty > 0) {
            summary += `핫 아메리카노 (${hotSize}) x ${hotQty} → ₩${hotQty * hotPrice}<br>`;
        }
        if (summary === "") {
            summary = "선택된 메뉴가 없습니다.";
        }

        document.getElementById("orderSummary").innerHTML = summary;
    }

    function updatePrice(size, basePrice){
        let sizeExtra = 0;

        if(size == "grande") sizeExtra = 500;
        else if(size == "venti") sizeExtra = 1000;

        return basePrice + sizeExtra
    }

    let timeoutId;
    let countdownInterval;

    function submitOrder() {
        const modal = document.getElementById("popupModal");
        modal.style.display = "flex";

        let timeLeft = 10; // 10초 타이머
        document.getElementById("countdown").innerText = `(${timeLeft}초 후 자동 취소)`;

        countdownInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                document.getElementById("countdown").innerText = `(${timeLeft}초 후 자동 취소)`;
            } else {
                confirmNo(); // 자동으로 "아니오" 실행
            }
        }, 1000);

        // 5초 후 자동 닫힘 (안전장치)
        timeoutId = setTimeout(() => {
            confirmNo();
        }, 5000);
    }

    function confirmYes() {
        clearTimeout(timeoutId);
        clearInterval(countdownInterval);

        const iceQty = parseInt(document.getElementById("inputIceQty").value);
        const hotQty = parseInt(document.getElementById("inputHotQty").value);
        const total = parseInt(document.getElementById("inputTotalPrice").value);

        window.location.href = `/stamp?iceQty=${iceQty}&hotQty=${hotQty}&totalPrice=${total}`;
    }

    function confirmNo() {
        clearTimeout(timeoutId);
        clearInterval(countdownInterval);

        document.getElementById("popupModal").style.display = "none";

        // 예시: 메인 화면으로 이동
        window.location.href = `/`;
    }

    function useCoupon(){
        const iceQty = parseInt(document.getElementById("inputIceQty").value);
        const hotQty = parseInt(document.getElementById("inputHotQty").value);
        const total = parseInt(document.getElementById("inputTotalPrice").value);

        window.location.href = `/couponUse?iceQty=${iceQty}&hotQty=${hotQty}&totalPrice=${total}`;
    }

    function pageBack(){
        window.location.href = `/`;
    }
</script>

</body>
</html>
